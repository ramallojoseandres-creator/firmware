name: Build Bruce mi placa (S3 + ILI9341)

on:
  workflow_dispatch:
  push:
    paths:
      - "boards/diy-s3-ili9341/**"
      - "boards/_boards_json/diy-s3-ili9341.json"
      - ".github/workflows/build-mi-placa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar PlatformIO
        run: |
          pip install requests esptool intelhex
          pip install platformio

      - name: Version
        run: |
          version="${GITHUB_SHA::7}"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini

      - name: Compilar
        run: |
          set -o pipefail
          for I in 1 2 3; do
            platformio run -e diy-s3-ili9341 | tee build.log && exit 0
            echo "Reintento $i..."; sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-diy-s3-ili9341
          path: Bruce-*.bin
          if-no-files-found: error
