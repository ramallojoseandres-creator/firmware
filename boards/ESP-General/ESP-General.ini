[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
extends                 = env:esp32-s3-devkitc-1


[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
${env.build_flags}
-Iboards/ESP-General
-DUSB_as_HID=1
-DHAS_SCREEN=1
-DGROVE_SDA=8
-DGROVE_SCL=46
-DILI9341_DRIVER=1
-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
-DTXLED=40
-DLED_ON=HIGH
-DLED_OFF=LOW
-DDEVICE_NAME=\"RamaSoft\"
-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
-DSDCARD_CS=-1
-DSDCARD_SCK=-1
-DSDCARD_MISO=-1
-DSDCARD_MOSI=-1
-DRFID_MOSI=35
-DRFID_MISO=37
-DRFID_SCK=36
-DRFID_SS=10
-DRFID_RST=9
-DROTATION=1
-DBACKLIGHT=-1
-DMINBRIGHT=160
-DTFT_DISPON=0x29
-DTFT_DISPOFF=0x28
-DTFT_MOSI=35
-DTFT_SCLK=36
-DTFT_CS=38
-DTFT_DC=16
-DTFT_RST=17
-DTOUCH_CS=15
-DSPI_SCK_PIN=36
-DSPI_MOSI_PIN=35
-DSPI_MISO_PIN=37
-DSPI_SS_PIN=15
-DFP=1
-DFM=2
-DFG=3
lib_deps =
${env.lib_deps}
