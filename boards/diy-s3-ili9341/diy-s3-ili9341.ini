; DIY: ESP32-S3 DevKitC-1 N16R8 + modulo 2.8" SPI ILI9341 (v1.2) con tactil XPT2046 y SD.
; Mismo cableado que la version de Launcher (boards/diy-esp32s3-ili9341 en el fork de Launcher).
; Pantalla/tactil/SD configurados como la CYD-2432S028 oficial, solo cambian los pines.

[env:diy-s3-ili9341]
board = diy-s3-ili9341
board_build.partitions = boards/ES3C28P/partitions_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/diy-s3-ili9341>
build_flags =
	${env.build_flags}
	-Iboards/diy-s3-ili9341
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DUSE_HSPI_PORT=1
	-DUSB_as_HID=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; Brillo por PWM
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	; Tactil resistivo XPT2046 en pines propios
	-DHAS_TOUCH=1
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DXPT2046_SPI_BUS_MISO_IO_NUM=4
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=5
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=6
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=9

lib_deps =
	${env.lib_deps}
