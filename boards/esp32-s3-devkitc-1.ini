[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
extends = env:esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ESP-General>
build_flags =
    ${env.build_flags}
    -Iboards/ESP-General
    -DUSB_as_HID=1
    -DHAS_SCREEN=1
    -DILI9341_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DDEVICE_NAME=\"RamaSoft\"
    -DROTATION=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=9
    -DTFT_BL=8
    -DTOUCH_CS=3
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
lib_deps =
    ${env.lib_deps}