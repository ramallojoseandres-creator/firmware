; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:smoochiee-board]
board = smoochiee-board
build_src_filter =${env.build_src_filter} +<../boards/smoochiee-board>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DIR_TX_PINS='{{"IR Emitter (2)", 2}, {"GPIO 1", 1}, {"GPIO 42", 42}}'
	-DIR_RX_PINS='{{"IR Receiver (1)", 1}, {"GPIO 2", 2}, {"GPIO 42", 42}}'
	-DRF_TX_PINS='{{"GPIO 42", 42}, {"GPIO 2", 2}, {"GPIO 1", 1}}'
	-DRF_RX_PINS='{{"GPIO 42", 42}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-D USE_HSPI_PORT=1
	;Resistive XPT2046 touchscreen handled by the TFT_eSPI driver
	-DHAS_TOUCH=1
	-DUSE_TFT_eSPI_TOUCH
	-DSPI_TOUCH_FREQUENCY=2500000
	;SD bus is managed explicitly (dedicated reader, or shared with the TFT)
	-DSDCARD_CUSTOM_BUS
	-DDEVICE_NAME='"RamaSoft"'

lib_deps =
	${env.lib_deps}
